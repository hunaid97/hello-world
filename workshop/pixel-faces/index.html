<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Faces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; border-radius: 0; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }

    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      position: relative;
    }
    canvas { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; background: #000; }
    .msg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.12em;
      pointer-events: none;
    }
    .msg[hidden] { display: none; }
    .faces {
      position: absolute;
      left: 16px;
      top: 16px;
      background: #000;
      padding: 2px 6px;
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    /* Controls */
    .panel {
      border-top: 1px solid #fff;
      padding: 14px 16px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 18px 28px;
    }
    .group { display: flex; flex-direction: column; gap: 8px; }
    .group > span { font-size: 10px; letter-spacing: 0.14em; }
    .row { display: flex; gap: 6px; align-items: center; }
    .push { margin-left: auto; }

    button {
      font: inherit;
      letter-spacing: inherit;
      padding: 6px 12px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      cursor: pointer;
    }
    button:hover, button[aria-pressed="true"] { background: #fff; color: #000; }
    button:focus-visible, input:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }

    .slider { display: flex; flex-direction: column; gap: 6px; width: 150px; }
    .slider label { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.14em; }
    input[type="range"] {
      width: 100%;
      margin: 0;
      height: 18px;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: #fff; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      margin-top: -5.5px;
      background: #fff;
      border: none;
    }
    input[type="range"]::-moz-range-track { height: 1px; background: #fff; }
    input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; background: #fff; border: none; }

    .flash {
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      background: #fff;
      color: #000;
      padding: 6px 12px;
      font-size: 13px;
      letter-spacing: 0.14em;
      pointer-events: none;
    }
    .flash[hidden] { display: none; }
    body.clean .panel, body.clean .faces { display: none; }
    body.clean .stage { padding: 0; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="view"></canvas>
    <span class="faces" id="faces">FACES: 0</span>
    <div class="flash" id="flash" hidden></div>
    <div class="msg" id="msg">STARTING CAMERA…</div>
  </div>

  <div class="panel">
    <div class="group">
      <span>MODE</span>
      <div class="row" id="modes">
        <button data-mode="0" aria-pressed="true">BLOCKS</button>
        <button data-mode="1">MONO</button>
        <button data-mode="2">GLITCH</button>
        <button data-mode="3" title="Cover hidden faces with your own image">REPLACE</button>
        <button id="pickImage" title="Choose the replacement image (or paste / drop one)">IMAGE…</button>
      </div>
    </div>
    <input type="file" id="imageFile" accept="image/*" hidden>
    <div class="group">
      <span>SHAPE</span>
      <div class="row" id="shapes">
        <button data-shape="0" aria-pressed="true">BOX</button>
        <button data-shape="1">OVAL</button>
      </div>
    </div>
    <div class="group">
      <span>GESTURES: ✕ HIDE · THUMBS UP SHOW</span>
      <div class="row">
        <button id="gestures" aria-pressed="true">ON</button>
        <button id="newFaces" title="What happens to someone who just walked in">NEW FACES: HIDDEN</button>
      </div>
    </div>

    <div class="slider">
      <label for="pw">PIXEL WIDTH <output id="pwOut"></output></label>
      <input id="pw" type="range" min="2" max="160" value="24">
    </div>
    <div class="slider">
      <label for="ph">PIXEL HEIGHT <output id="phOut"></output></label>
      <input id="ph" type="range" min="2" max="160" value="24">
    </div>
    <div class="group">
      <span>X / Y</span>
      <button id="lock" aria-pressed="true">LOCKED</button>
    </div>
    <div class="slider">
      <label for="noise">NOISE <output id="noiseOut"></output></label>
      <input id="noise" type="range" min="0" max="100" value="0">
    </div>
    <div class="slider">
      <label for="levels">COLOURS <output id="levelsOut"></output></label>
      <input id="levels" type="range" min="2" max="33" value="33">
    </div>
    <div class="slider">
      <label for="pad">PADDING <output id="padOut"></output></label>
      <input id="pad" type="range" min="0" max="100" value="35">
    </div>

    <div class="group push">
      <span>VIEW</span>
      <div class="row">
        <button id="clean" title="Hide the controls (H)">HIDE UI</button>
        <button id="full">FULLSCREEN</button>
      </div>
    </div>
  </div>

  <video id="cam" autoplay playsinline muted hidden></video>

  <script type="module">
    const $ = id => document.getElementById(id);
    const video = $('cam');
    const canvas = $('view');
    const msg = text => { $('msg').textContent = text; $('msg').hidden = !text; };

    const MAX_FACES = 8;
    const HOLD_MS = 400; // keep pixelating a lost face this long so it never flashes through

    // ---------- controls ----------
    const state = { mode: 0, shape: 0, locked: true };
    function pick(groupId, key) {
      $(groupId).querySelectorAll('button').forEach(b => b.onclick = () => {
        state[key] = +b.dataset[key];
        $(groupId).querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      });
    }
    pick('modes', 'mode');
    pick('shapes', 'shape');

    const outputs = {
      pw: v => v + 'PX', ph: v => v + 'PX', noise: v => v + '%',
      levels: v => (+v >= 33 ? 'FULL' : v), pad: v => v + '%',
    };
    function syncOutputs() {
      for (const [id, fmt] of Object.entries(outputs)) $(id + 'Out').textContent = fmt($(id).value);
    }
    $('pw').addEventListener('input', () => { if (state.locked) $('ph').value = $('pw').value; syncOutputs(); });
    $('ph').addEventListener('input', () => { if (state.locked) $('pw').value = $('ph').value; syncOutputs(); });
    ['noise', 'levels', 'pad'].forEach(id => $(id).addEventListener('input', syncOutputs));
    $('lock').onclick = () => {
      state.locked = !state.locked;
      $('lock').setAttribute('aria-pressed', String(state.locked));
      $('lock').textContent = state.locked ? 'LOCKED' : 'FREE';
      if (state.locked) { $('ph').value = $('pw').value; syncOutputs(); }
    };
    syncOutputs();

    const toggleClean = () => document.body.classList.toggle('clean');
    $('clean').onclick = toggleClean;
    $('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    document.addEventListener('keydown', e => {
      if (e.key === 'h' || e.key === 'H') toggleClean();
      if (e.key === 'Escape') document.body.classList.remove('clean');
    });

    // ---------- face tracking ----------
    // Detections are matched to tracks between frames so boxes glide instead of jumping,
    // and tracks survive short dropouts.
    let tracks = [];
    // Recently lost faces (or an X made while the face was covered) remember hidden/visible,
    // so someone who briefly drops out keeps their state when they're found again.
    let memories = [];
    function inheritState(d, now) {
      const cx = d.x + d.w / 2, cy = d.y + d.h / 2;
      memories = memories.filter(m => m.until > now);
      const i = memories.findIndex(m => Math.hypot(m.x - cx, m.y - cy) < Math.max(m.w, d.w) * 1.2);
      if (i < 0) return state.newHidden;
      const [m] = memories.splice(i, 1);
      return m.hidden;
    }
    function updateTracks(detections, now) {
      for (const d of detections) {
        const cx = d.x + d.w / 2, cy = d.y + d.h / 2;
        let best = null, bestDist = Infinity;
        for (const t of tracks) {
          if (t.matched) continue;
          const dist = Math.hypot(t.x + t.w / 2 - cx, t.y + t.h / 2 - cy);
          if (dist < Math.max(t.w, d.w) && dist < bestDist) { best = t; bestDist = dist; }
        }
        if (best) {
          const k = 0.6;
          best.x += (d.x - best.x) * k; best.y += (d.y - best.y) * k;
          best.w += (d.w - best.w) * k; best.h += (d.h - best.h) * k;
          best.angle += (d.angle - best.angle) * k;
          best.seen = now;
          best.matched = true;
        } else if (tracks.length < MAX_FACES) {
          tracks.push({ ...d, seen: now, matched: true, hidden: inheritState(d, now), cooldown: 0 });
        }
      }
      for (const t of tracks) {
        if (now - t.seen >= HOLD_MS) memories.push({ x: t.x + t.w / 2, y: t.y + t.h / 2, w: t.w, hidden: t.hidden, until: now + 2500 });
      }
      tracks = tracks.filter(t => now - t.seen < HOLD_MS);
      tracks.forEach(t => { t.matched = false; });
    }

    let detector = null;
    async function loadDetector() {
      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
      const { FaceDetector, FilesetResolver } = await import(`${base}/vision_bundle.mjs`);
      const files = await FilesetResolver.forVisionTasks(`${base}/wasm`);
      const opts = delegate => ({
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',
          delegate,
        },
        runningMode: 'VIDEO',
        minDetectionConfidence: 0.4,
      });
      try { return await FaceDetector.createFromOptions(files, opts('GPU')); }
      catch { return await FaceDetector.createFromOptions(files, opts('CPU')); }
    }

    // ---------- gestures ----------
    let recognizer = null;
    let poser = null;
    async function loadPoser() {
      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
      const { PoseLandmarker, FilesetResolver } = await import(`${base}/vision_bundle.mjs`);
      const files = await FilesetResolver.forVisionTasks(`${base}/wasm`);
      const opts = delegate => ({
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
          delegate,
        },
        runningMode: 'VIDEO',
        numPoses: MAX_FACES,
      });
      try { return await PoseLandmarker.createFromOptions(files, opts('GPU')); }
      catch { return await PoseLandmarker.createFromOptions(files, opts('CPU')); }
    }
    async function loadRecognizer() {
      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
      const { GestureRecognizer, FilesetResolver } = await import(`${base}/vision_bundle.mjs`);
      const files = await FilesetResolver.forVisionTasks(`${base}/wasm`);
      const opts = delegate => ({
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',
          delegate,
        },
        runningMode: 'VIDEO',
        numHands: 4,
        minHandDetectionConfidence: 0.4,
        minHandPresenceConfidence: 0.4,
      });
      try { return await GestureRecognizer.createFromOptions(files, opts('GPU')); }
      catch { return await GestureRecognizer.createFromOptions(files, opts('CPU')); }
    }

    // Segment intersection; returns the crossing point or null
    function cross(a, b, c, d) {
      const r = { x: b.x - a.x, y: b.y - a.y }, q = { x: d.x - c.x, y: d.y - c.y };
      const den = r.x * q.y - r.y * q.x;
      if (Math.abs(den) < 1e-6) return null;
      const t = ((c.x - a.x) * q.y - (c.y - a.y) * q.x) / den;
      const u = ((c.x - a.x) * r.y - (c.y - a.y) * r.x) / den;
      return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? { x: a.x + r.x * t, y: a.y + r.y * t } : null;
    }

    // Thumbs up, from the hand-gesture model: [{ kind: 'up', x, y, reach }]
    function readThumbs(result, W, H) {
      return result.landmarks.flatMap((lm, i) => {
        const g = result.gestures[i]?.[0];
        if (!(g?.categoryName === 'Thumb_Up' && g.score > 0.55)) return [];
        const c = lm.reduce((a, p) => ({ x: a.x + p.x * W / lm.length, y: a.y + p.y * H / lm.length }), { x: 0, y: 0 });
        const len = Math.hypot((lm[12].x - lm[0].x) * W, (lm[12].y - lm[0].y) * H);
        return [{ kind: 'up', x: c.x, y: c.y, reach: Math.max(len * 3, W * 0.12) }];
      });
    }

    // X with the forearms, from the pose model: each forearm is elbow -> wrist (a touch longer),
    // and an X is the two lines crossing. Reported at the person's nose so it lands on their face.
    function readCrosses(result, W, H) {
      return result.landmarks.flatMap(lm => {
        const P = j => ({ x: lm[j].x * W, y: lm[j].y * H });
        const ok = j => (lm[j].visibility ?? 1) > 0.5;
        if (![13, 14, 15, 16].every(ok)) return [];
        const arm = (e, w) => {
          const E = P(e), Wr = P(w);
          return [E, { x: Wr.x + (Wr.x - E.x) * 0.25, y: Wr.y + (Wr.y - E.y) * 0.25 }];
        };
        const [a1, a2] = arm(13, 15), [b1, b2] = arm(14, 16);
        if (!cross(a1, a2, b1, b2)) return [];
        const nose = P(0);
        const reach = Math.max(Math.hypot(a2.x - a1.x, a2.y - a1.y), W * 0.12);
        return [{ kind: 'x', x: nose.x, y: nose.y, reach }];
      });
    }

    // A gesture has to be held ~¼ s before it counts; then that face can't flip again for a moment
    const HOLD_GESTURE_MS = 250, COOLDOWN_MS = 1200;
    const pending = { x: [], up: [] };
    function applyGestures(kind, gs, now) {
      const next = [];
      for (const g of gs) {
        const prev = pending[kind].find(p => Math.hypot(p.x - g.x, p.y - g.y) < g.reach);
        next.push({ ...g, since: prev ? prev.since : now, fired: prev?.fired });
      }
      pending[kind] = next;
      for (const g of next) {
        if (g.fired || now - g.since < HOLD_GESTURE_MS) continue;
        g.fired = true;
        const hide = g.kind === 'x';
        // The nearest face within reach of the gesture
        let face = null, best = Infinity;
        for (const t of tracks) {
          const dist = Math.hypot(t.x + t.w / 2 - g.x, t.y + t.h / 2 - g.y);
          if (dist < Math.max(g.reach, t.w * 2.5) && dist < best) { face = t; best = dist; }
        }
        if (face) {
          if (now < face.cooldown) continue;
          face.hidden = hide;
          face.cooldown = now + COOLDOWN_MS;
        } else if (hide) {
          // Arms crossed over a face the detector can't see right now: remember it for when it reappears
          memories.push({ x: g.x, y: g.y, w: g.reach, hidden: true, until: now + 3000 });
        } else continue;
        flash(hide ? '✕ HIDDEN' : 'VISIBLE');
      }
    }

    let flashTimer = 0;
    function flash(text) {
      $('flash').textContent = text;
      $('flash').hidden = false;
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { $('flash').hidden = true; }, 1000);
    }

    state.gestures = true;
    state.newHidden = true;
    $('gestures').onclick = () => {
      state.gestures = !state.gestures;
      $('gestures').setAttribute('aria-pressed', String(state.gestures));
      $('gestures').textContent = state.gestures ? 'ON' : 'OFF';
      // Turning gestures off goes back to hiding everyone
      if (!state.gestures) tracks.forEach(t => { t.hidden = true; });
    };
    $('newFaces').onclick = () => {
      state.newHidden = !state.newHidden;
      $('newFaces').textContent = 'NEW FACES: ' + (state.newHidden ? 'HIDDEN' : 'VISIBLE');
    };

    // ---------- WebGPU ----------
    const WGSL = `
      struct U {
        res: vec2f,
        pix: vec2f,
        noise: f32,
        levels: f32,
        mode: f32,
        shape: f32,
        time: f32,
        count: f32,
        stickerAspect: f32,
        hasSticker: f32,
        rects: array<vec4f, ${MAX_FACES}>,
        angles: array<vec4f, ${MAX_FACES / 4}>,
      };
      @group(0) @binding(0) var samp: sampler;
      @group(0) @binding(1) var vid: texture_external;
      @group(0) @binding(2) var<uniform> u: U;
      @group(0) @binding(3) var sticker: texture_2d<f32>;

      fn angleOf(i: u32) -> f32 { return u.angles[i / 4u][i % 4u]; }

      // Replace mode: draw the image over each hidden face, turned with the head
      fn replaceFaces(p: vec2f) -> vec3f {
        var col = sampleAt(p);
        for (var i = 0u; i < u32(u.count); i++) {
          let r = u.rects[i];
          let mid = (r.xy + r.zw) * 0.5;
          let h = r.w - r.y;
          let size = vec2f(h * u.stickerAspect, h);
          let a = -angleOf(i);
          let d = p - mid;
          let l = vec2f(d.x * cos(a) - d.y * sin(a), d.x * sin(a) + d.y * cos(a));
          let uv = l / size + 0.5;
          if (all(uv >= vec2f(0.0)) && all(uv <= vec2f(1.0))) {
            // The view is mirrored, so flip the image to read the right way round
            let st = textureSampleLevel(sticker, samp, vec2f(1.0 - uv.x, uv.y), 0.0);
            col = mix(col, st.rgb, st.a);
          }
        }
        return col;
      }

      @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
        var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
        return vec4f(p[i], 0.0, 1.0);
      }

      fn hash(p: vec3f) -> f32 {
        return fract(sin(dot(p, vec3f(12.9898, 78.233, 37.719))) * 43758.5453);
      }

      fn sampleAt(p: vec2f) -> vec3f {
        return textureSampleBaseClampToEdge(vid, samp, p / u.res).rgb;
      }

      // Is this cell centre inside any face region? (box, or ellipse inscribed in the box)
      fn inRegion(c: vec2f) -> bool {
        for (var i = 0u; i < u32(u.count); i++) {
          let r = u.rects[i];
          if (u.shape < 0.5) {
            if (c.x >= r.x && c.x <= r.z && c.y >= r.y && c.y <= r.w) { return true; }
          } else {
            let mid = (r.xy + r.zw) * 0.5;
            let half = max((r.zw - r.xy) * 0.5, vec2f(1.0));
            let q = (c - mid) / half;
            if (dot(q, q) <= 1.0) { return true; }
          }
        }
        return false;
      }

      @fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
        // Mirrored like a selfie camera; video pixel coordinates, top-left origin
        let p = vec2f(u.res.x - pos.x, pos.y);
        if (u.mode > 2.5) {
          return vec4f(replaceFaces(p), 1.0);
        }
        // Global grid so blocks stay put while faces move
        let cell = floor(p / u.pix);
        let centre = (cell + 0.5) * u.pix;
        if (!inRegion(centre)) {
          return vec4f(sampleAt(p), 1.0);
        }

        let tick = floor(u.time * 24.0);
        var sp = centre;
        if (u.mode > 1.5) {
          // Glitch: whole rows of blocks jump sideways
          let jump = hash(vec3f(7.0, cell.y, floor(u.time * 10.0))) - 0.5;
          sp.x += jump * (0.15 + u.noise) * u.pix.x * 6.0;
        }

        // Average a 3x3 grid of samples inside the block
        var col = vec3f(0.0);
        for (var j = 0; j < 3; j++) {
          for (var i = 0; i < 3; i++) {
            col += sampleAt(sp + (vec2f(f32(i), f32(j)) - 1.0) * u.pix / 3.0);
          }
        }
        col /= 9.0;

        let n = (hash(vec3f(cell, tick)) - 0.5) * u.noise;
        let steps = max(u.levels - 1.0, 1.0);
        if (u.mode > 0.5 && u.mode < 1.5) {
          // Mono: grey blocks; COLOURS sets how many greys (2 = pure black and white)
          var l = dot(col, vec3f(0.299, 0.587, 0.114)) + n;
          if (u.levels < 33.0) { l = floor(clamp(l, 0.0, 1.0) * steps + 0.5) / steps; }
          col = vec3f(l);
        } else {
          col += vec3f(n);
          if (u.levels < 33.0) { col = floor(clamp(col, vec3f(0.0), vec3f(1.0)) * steps + 0.5) / steps; }
        }
        return vec4f(clamp(col, vec3f(0.0), vec3f(1.0)), 1.0);
      }`;

    let gpu = null;
    async function initGpu() {
      const adapter = await navigator.gpu?.requestAdapter();
      const device = await adapter?.requestDevice();
      if (!device) return null;
      const format = navigator.gpu.getPreferredCanvasFormat();
      const ctx = canvas.getContext('webgpu');
      ctx.configure({ device, format, alphaMode: 'opaque' });
      const module = device.createShaderModule({ code: WGSL });
      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module, entryPoint: 'vs' },
        fragment: { module, entryPoint: 'fs', targets: [{ format }] },
        primitive: { topology: 'triangle-list' },
      });
      const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
      const ubuf = device.createBuffer({ size: 48 + 16 * MAX_FACES + 4 * MAX_FACES, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      // 1x1 transparent placeholder until an image is chosen
      const empty = device.createTexture({ size: [1, 1], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
      device.queue.writeTexture({ texture: empty }, new Uint8Array(4), { bytesPerRow: 4 }, [1, 1]);
      return { device, ctx, pipeline, sampler, ubuf, empty };
    }

    const uniforms = new Float32Array(12 + 4 * MAX_FACES + MAX_FACES);
    let sticker = null; // { texture, aspect }
    function render(now) {
      const { device, ctx, pipeline, sampler, ubuf } = gpu;
      const W = video.videoWidth, H = video.videoHeight;
      const pad = $('pad').value / 100;
      // Replace mode without an image falls back to plain blocks
      const mode = state.mode === 3 && !sticker ? 0 : state.mode;
      uniforms.set([W, H, +$('pw').value, +$('ph').value, $('noise').value / 100, +$('levels').value,
                    mode, state.shape, now / 1000, 0, sticker ? sticker.aspect : 1, sticker ? 1 : 0]);
      const masked = tracks.filter(t => t.hidden || !state.gestures);
      uniforms[9] = masked.length;
      masked.forEach((t, i) => {
        // Padding grows the box, a little more upwards to cover hair and forehead
        const px = t.w * pad * 0.5, py = t.h * pad * 0.5;
        uniforms.set([t.x - px, t.y - py * 1.6, t.x + t.w + px, t.y + t.h + py * 0.8], 12 + i * 4);
        uniforms[12 + 4 * MAX_FACES + i] = t.angle || 0;
      });
      device.queue.writeBuffer(ubuf, 0, uniforms);

      const bind = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: sampler },
          { binding: 1, resource: device.importExternalTexture({ source: video }) },
          { binding: 2, resource: { buffer: ubuf } },
          { binding: 3, resource: (sticker ? sticker.texture : gpu.empty).createView() },
        ],
      });
      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({
        colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }],
      });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bind);
      pass.draw(3);
      pass.end();
      device.queue.submit([enc.finish()]);
    }

    // ---------- replacement image ----------
    async function loadSticker(blob, remember = true) {
      const bmp = await createImageBitmap(blob);
      const k = Math.min(1, 768 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bmp.width * k));
      c.height = Math.max(1, Math.round(bmp.height * k));
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const { device } = gpu;
      const texture = device.createTexture({
        size: [c.width, c.height], format: 'rgba8unorm',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
      });
      device.queue.copyExternalImageToTexture({ source: c }, { texture }, [c.width, c.height]);
      sticker?.texture.destroy();
      sticker = { texture, aspect: c.width / c.height };
      if (remember) { try { localStorage.setItem('pixel-faces-image', c.toDataURL('image/png')); } catch {} }
      flash('IMAGE SET');
    }
    const useImage = blob => {
      if (!blob?.type?.startsWith('image/') || !gpu) return;
      loadSticker(blob).then(() => $('modes').querySelector('[data-mode="3"]').click()).catch(() => flash('COULDN’T READ THAT IMAGE'));
    };
    $('pickImage').onclick = () => $('imageFile').click();
    $('imageFile').onchange = e => { useImage(e.target.files[0]); e.target.value = ''; };
    document.addEventListener('paste', e => {
      const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
      if (item) { e.preventDefault(); useImage(item.getAsFile()); }
    });
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      useImage([...e.dataTransfer.files].find(f => f.type.startsWith('image/')));
    });
    $('modes').querySelector('[data-mode="3"]').addEventListener('click', () => {
      if (!sticker) flash('PASTE, DROP OR CHOOSE AN IMAGE');
    });
    async function restoreSticker() {
      try {
        const saved = localStorage.getItem('pixel-faces-image');
        if (saved) await loadSticker(await (await fetch(saved)).blob(), false);
      } catch {}
    }

    // ---------- loop ----------
    let lastVideoTime = -1;
    let frame = 0;
    function loop(now) {
      requestAnimationFrame(loop);
      // Nothing is shown until face detection is ready, so no face is ever visible unpixelated
      if (video.readyState < 2 || !detector) return;
      if (detector && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const vw = video.videoWidth, vh = video.videoHeight;
        const found = detector.detectForVideo(video, now).detections.map(d => {
          const [re, le] = d.keypoints || [];
          const angle = re && le ? Math.atan2((le.y - re.y) * vh, (le.x - re.x) * vw) : 0;
          return { x: d.boundingBox.originX, y: d.boundingBox.originY, w: d.boundingBox.width, h: d.boundingBox.height, angle };
        });
        updateTracks(found, now);
        if (state.gestures) {
          // Alternate the two models between frames to keep the frame rate up
          const W = video.videoWidth, H = video.videoHeight;
          if (frame++ % 2 === 0) { if (poser) applyGestures('x', readCrosses(poser.detectForVideo(video, now), W, H), now); }
          else if (recognizer) applyGestures('up', readThumbs(recognizer.recognizeForVideo(video, now), W, H), now);
        }
        const hiddenCount = tracks.filter(t => t.hidden || !state.gestures).length;
        $('faces').textContent = `FACES: ${tracks.length} · HIDDEN: ${hiddenCount}`;
      }
      render(now);
    }

    try {
      gpu = await initGpu();
      if (!gpu) throw new Error('This needs WebGPU. Try the latest Chrome, Edge or Safari.');
      video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      msg('LOADING FACE DETECTION…');
      restoreSticker();
      requestAnimationFrame(loop);
      detector = await loadDetector();
      msg('');
      // Gestures load after faces are already protected
      loadPoser().then(r => { poser = r; }).catch(() => flash('X GESTURE UNAVAILABLE'));
      loadRecognizer().then(r => { recognizer = r; }).catch(() => flash('THUMBS UP UNAVAILABLE'));
    } catch (err) {
      msg(err.message.toUpperCase());
    }
  </script>
</body>
</html>
