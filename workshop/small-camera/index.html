<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Camera</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #888;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      overflow: hidden;
    }
    video {
      width: 40vw;
      max-height: 80vh;
      object-fit: cover;
      transform: scaleX(-1); /* mirror like a selfie camera */
      background: #000;
    }
    input[type="range"] {
      width: min(320px, 80vw);
      accent-color: #fff;
    }
    #error {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <input id="size" type="range" min="5" max="100" value="40" aria-label="Camera size">
  <p id="error" hidden></p>

  <script>
    const video = document.getElementById('cam');
    const slider = document.getElementById('size');
    const error = document.getElementById('error');

    slider.addEventListener('input', () => {
      video.style.width = slider.value + 'vw';
    });

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => { video.srcObject = stream; })
      .catch(err => {
        error.textContent = 'Camera unavailable: ' + err.message;
        error.hidden = false;
      });
  </script>
</body>
</html>
