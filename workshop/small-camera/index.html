<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Camera</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 40vw;
      max-height: calc(100vh - 160px);
      object-fit: cover;
      transform: scaleX(-1); /* mirror like a selfie camera */
      background: #000;
    }

    /* Slider pinned to the bottom so it never moves when the video resizes */
    input[type="range"] {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      width: min(320px, 80vw);
      margin: 0;
      height: 24px;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      background: #fff;
      border-radius: 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -7px;
      background: #fff;
      border: none;
      border-radius: 0;
    }
    input[type="range"]::-moz-range-track {
      height: 2px;
      background: #fff;
      border-radius: 0;
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #fff;
      border: none;
      border-radius: 0;
    }

    #error {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      padding: 0 16px;
      margin: 0;
    }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <input id="size" type="range" min="5" max="100" value="40" aria-label="Camera size">
  <p id="error" hidden></p>

  <script>
    const video = document.getElementById('cam');
    const slider = document.getElementById('size');
    const error = document.getElementById('error');

    slider.addEventListener('input', () => {
      video.style.width = slider.value + 'vw';
    });

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => { video.srcObject = stream; })
      .catch(err => {
        error.textContent = 'Camera unavailable: ' + err.message;
        error.hidden = false;
      });
  </script>
</body>
</html>
