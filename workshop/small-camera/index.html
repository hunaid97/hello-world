<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Camera</title>
  <style>
    * { border-radius: 0; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-bottom: 220px; /* keep the view clear of the fixed controls */
      box-sizing: border-box;
    }

    /* The raw camera is hidden; the canvas shows the (possibly warped) feed */
    video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas { display: block; background: #000; }

    .marker {
      position: fixed;
      width: 14px;
      height: 14px;
      margin: -9px 0 0 -9px;
      background: #fff;
      border: 2px solid #000;
      outline: 1px solid #fff;
      cursor: grab;
      touch-action: none;
    }
    .marker:active { cursor: grabbing; }

    #controls {
      position: fixed;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: max-content;
      max-width: calc(100vw - 32px);
    }
    #status { margin: 0; font-size: 14px; text-align: center; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .row[hidden] { display: none; }

    button {
      font: inherit;
      font-size: 14px;
      padding: 8px 14px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      cursor: pointer;
    }
    button:hover, button[aria-pressed="true"] { background: #fff; color: #000; }
    button:disabled { opacity: 0.4; cursor: default; background: #000; color: #fff; }
    button:focus-visible { outline: 1px solid #fff; outline-offset: 2px; }
    button.icon { width: 44px; height: 38px; padding: 0; display: grid; place-items: center; }
    button.icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linejoin: miter;
    }

    /* Sliders: square white thumb on a thin white track */
    input[type="range"] {
      margin: 0;
      height: 24px;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }
    input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: #fff; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -7px;
      background: #fff;
      border: none;
    }
    input[type="range"]::-moz-range-track { height: 2px; background: #fff; }
    input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: #fff; border: none; }

    /* Camera size slider pinned to the bottom so it never moves when the view resizes */
    #size {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      width: min(320px, 80vw);
    }

    /* Smaller shape size slider */
    #shapeSize { width: 160px; height: 20px; }
    #shapeSize::-webkit-slider-runnable-track { height: 1px; }
    #shapeSize::-webkit-slider-thumb { width: 12px; height: 12px; margin-top: -5.5px; }
    #shapeSize::-moz-range-track { height: 1px; }
    #shapeSize::-moz-range-thumb { width: 12px; height: 12px; }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="view"></canvas>

  <div class="marker" data-i="0" hidden></div>
  <div class="marker" data-i="1" hidden></div>
  <div class="marker" data-i="2" hidden></div>

  <div id="controls">
    <p id="status">Starting camera…</p>
    <div class="row" id="step1">
      <button id="confirm" disabled>Confirm</button>
    </div>
    <div class="row" id="step2" hidden>
      <button class="icon" data-shape="square" aria-label="Square" title="Square">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/></svg>
      </button>
      <button class="icon" data-shape="circle" aria-label="Circle" title="Circle">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></svg>
      </button>
      <button class="icon" data-shape="ellipse" aria-label="Ellipse" title="Ellipse">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="5.5"/></svg>
      </button>
      <button class="icon" data-shape="triangle" aria-label="Triangle" title="Triangle">
        <svg viewBox="0 0 24 24"><polygon points="12,3.5 21,19.5 3,19.5"/></svg>
      </button>
      <button id="remark">Re-mark face</button>
    </div>
    <input id="shapeSize" type="range" min="50" max="200" value="100" aria-label="Shape size" hidden>
  </div>

  <input id="size" type="range" min="5" max="100" value="40" aria-label="Camera size">

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

    const video = document.getElementById('cam');
    const canvas = document.getElementById('view');
    const slider = document.getElementById('size');
    const status = document.getElementById('status');
    const confirmBtn = document.getElementById('confirm');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const markers = [...document.querySelectorAll('.marker')];
    const shapeBtns = [...document.querySelectorAll('[data-shape]')];
    const shapeSize = document.getElementById('shapeSize');

    // MediaPipe face mesh indices
    const OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377,
                  152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
    const EYE_A = 468, EYE_B = 473;          // iris centres (image-left, image-right)
    const LIP_TOP = 13, LIP_BOTTOM = 14;

    const N = 64;                            // angular samples around the face
    const SMOOTH = 0.5;                      // landmark smoothing (0 = frozen, 1 = raw)

    let step = 1;
    let shape = null;
    let W = 0, H = 0;                        // video size in pixels
    let pts = null;                          // smoothed [eyeA, eyeB, mouth] in video px
    let oval = null;                         // smoothed face outline in video px
    let faceSeen = false;
    const offsets = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }]; // user corrections, face-local units
    const faceR = new Float32Array(N);
    let center = { x: 0, y: 0 };
    let rot = 0, r0 = 0;                     // face roll and mean face radius

    // Shapes are drawn exactly in the shader; 0 = no shape (face as-is)
    const SHAPES = { square: 1, circle: 2, ellipse: 3, triangle: 4 };
    let shapeFrom = 0, shapeTo = 0, shapeT = 1; // transition between shapes
    let lastNow = 0;

    // ---------- geometry ----------
    const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const frameOf = (a, b) => {
      const v = sub(b, a), d = Math.hypot(v.x, v.y) || 1;
      const ex = { x: v.x / d, y: v.y / d };
      return { ex, ey: { x: -ex.y, y: ex.x }, d }; // ey points from eyes towards mouth
    };
    const toWorld = (p, off, f) => ({
      x: p.x + (f.ex.x * off.x + f.ey.x * off.y) * f.d,
      y: p.y + (f.ex.y * off.x + f.ey.y * off.y) * f.d,
    });
    const toLocal = (v, f) => ({ x: (v.x * f.ex.x + v.y * f.ex.y) / f.d, y: (v.x * f.ey.x + v.y * f.ey.y) / f.d });

    // Distance from origin o along unit dir to the far side of polygon poly
    function rayPoly(o, dir, poly) {
      let best = 0;
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i], b = poly[(i + 1) % poly.length];
        const e = sub(b, a), w = sub(a, o);
        const den = dir.x * e.y - dir.y * e.x;
        if (Math.abs(den) < 1e-9) continue;
        const t = (w.x * e.y - w.y * e.x) / den;
        const s = (w.x * dir.y - w.y * dir.x) / den;
        if (t > 0 && s >= 0 && s <= 1 && t > best) best = t;
      }
      return best;
    }

    // User-corrected eye/mouth positions
    function corrected() {
      const f = frameOf(pts[0], pts[1]);
      return pts.map((p, i) => toWorld(p, offsets[i], f));
    }

    function updateWarp(now) {
      if (faceSeen) {
        const c = corrected();
        center = { x: (c[0].x + c[1].x + c[2].x) / 3, y: (c[0].y + c[1].y + c[2].y) / 3 };
        const f = frameOf(c[0], c[1]);
        rot = Math.atan2(f.ex.y, f.ex.x);
        r0 = 0;
        for (let i = 0; i < N; i++) {
          const a = -Math.PI + i * 2 * Math.PI / N;
          faceR[i] = rayPoly(center, { x: Math.cos(a), y: Math.sin(a) }, oval) || faceR[i];
          r0 += faceR[i] / N;
        }
      }
      const target = faceSeen && step === 2 && shape ? SHAPES[shape] : 0;
      if (target !== shapeTo) {
        shapeFrom = shapeTo;
        shapeTo = target;
        shapeT = 0;
      }
      shapeT = Math.min(1, shapeT + (now - lastNow) / 250);
      lastNow = now;
    }

    // ---------- WebGL warp ----------
    const gl = canvas.getContext('webgl2');
    const vs = `#version 300 es
      in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
    const fs = `#version 300 es
      precision highp float;
      uniform sampler2D uTex;
      uniform vec2 uRes, uCenter;
      uniform float uFace[${N}];
      uniform bool uWarp;
      uniform int uFrom, uTo;
      uniform float uT, uRot, uR0;
      out vec4 color;
      const float PI = 3.14159265;

      // Exact radius of a shape at face-local angle phi
      float shapeR(int id, float phi, float rf) {
        float c = cos(phi), s = sin(phi);
        if (id == 1) return 0.9 * uR0 / max(abs(c), abs(s));
        if (id == 2) return uR0;
        if (id == 3) { float a = 1.3 * uR0, b = 0.72 * uR0; return a * b / length(vec2(b * c, a * s)); }
        if (id == 4) { float k = mod(phi + PI / 2.0, 2.0 * PI / 3.0) - PI / 3.0; return 0.675 * uR0 / cos(k); }
        return rf;
      }

      vec2 warp(vec2 p) {
        vec2 d = p - uCenter;
        float r = length(d);
        if (!uWarp || r <= 0.0) return p;
        float a = atan(d.y, d.x);
        float f = (a + PI) / (2.0 * PI) * ${N}.0;
        int i0 = int(floor(f)) % ${N};
        int i1 = (i0 + 1) % ${N};
        float rf = mix(uFace[i0], uFace[i1], fract(f));
        float rs = mix(shapeR(uFrom, a - uRot, rf), shapeR(uTo, a - uRot, rf), uT);
        float on = mix(uFrom > 0 ? 1.0 : 0.0, uTo > 0 ? 1.0 : 0.0, uT);
        // Hard cut: the shape shows the face slightly inset, and just outside it
        // jumps straight to what lies beyond the face, so the edge is crisp.
        float inner = rf * (1.0 - 0.06 * on);
        float outer = rf * (1.0 + 0.15 * on);
        float rout = max(rs, outer) * 1.6;
        float src = r;
        if (r < rs) src = r * inner / rs;
        else if (r < rout) src = outer + (r - rs) * (rout - outer) / (rout - rs);
        return uCenter + d / r * src;
      }

      void main() {
        // mirrored, top-left origin video pixel coordinates
        vec2 p = vec2(uRes.x - gl_FragCoord.x, uRes.y - gl_FragCoord.y);
        // 4x supersampling keeps the sharp edge from looking jagged
        vec4 c = vec4(0.0);
        c += texture(uTex, warp(p + vec2(-0.25, -0.25)) / uRes);
        c += texture(uTex, warp(p + vec2( 0.25, -0.25)) / uRes);
        c += texture(uTex, warp(p + vec2(-0.25,  0.25)) / uRes);
        c += texture(uTex, warp(p + vec2( 0.25,  0.25)) / uRes);
        color = c * 0.25;
      }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    const u = name => gl.getUniformLocation(prog, name);
    const uRes = u('uRes'), uCenter = u('uCenter'), uFace = u('uFace'), uWarp = u('uWarp');
    const uFrom = u('uFrom'), uTo = u('uTo'), uT = u('uT'), uRot = u('uRot'), uR0 = u('uR0');

    function render() {
      gl.viewport(0, 0, W, H);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
      gl.uniform2f(uRes, W, H);
      gl.uniform2f(uCenter, center.x, center.y);
      gl.uniform1fv(uFace, faceR);
      gl.uniform1i(uFrom, shapeFrom);
      gl.uniform1i(uTo, shapeTo);
      gl.uniform1f(uT, shapeT * shapeT * (3 - 2 * shapeT)); // ease in-out
      gl.uniform1f(uRot, rot);
      gl.uniform1f(uR0, r0 * shapeSize.value / 100);
      gl.uniform1i(uWarp, faceR[0] > 0 ? 1 : 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // ---------- layout ----------
    function layout() {
      if (!W) return;
      const maxW = window.innerWidth * slider.value / 100;
      const maxH = window.innerHeight - 260;
      const scale = Math.min(maxW / W, maxH / H);
      canvas.style.width = W * scale + 'px';
      canvas.style.height = H * scale + 'px';
    }
    slider.addEventListener('input', layout);
    window.addEventListener('resize', layout);

    // video px (unmirrored) <-> screen px (mirrored view)
    function toScreen(p) {
      const r = canvas.getBoundingClientRect();
      return { x: r.left + (1 - p.x / W) * r.width, y: r.top + p.y / H * r.height };
    }
    function toVideo(x, y) {
      const r = canvas.getBoundingClientRect();
      return { x: (1 - (x - r.left) / r.width) * W, y: (y - r.top) / r.height * H };
    }

    function placeMarkers() {
      const show = step === 1 && faceSeen;
      const c = show ? corrected() : null;
      markers.forEach((m, i) => {
        m.hidden = !show;
        if (show) {
          const s = toScreen(c[i]);
          m.style.left = s.x + 'px';
          m.style.top = s.y + 'px';
        }
      });
    }

    // ---------- dragging markers ----------
    markers.forEach((m, i) => {
      m.addEventListener('pointerdown', e => {
        m.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      m.addEventListener('pointermove', e => {
        if (!m.hasPointerCapture(e.pointerId) || !pts) return;
        const v = toVideo(e.clientX, e.clientY);
        offsets[i] = toLocal(sub(v, pts[i]), frameOf(pts[0], pts[1]));
      });
    });

    // ---------- steps ----------
    function setStatus() {
      if (step === 2) status.textContent = shape ? '' : 'Pick a shape.';
      else status.textContent = faceSeen
        ? 'Drag the markers onto your eyes and mouth if they’re off, then confirm.'
        : 'Looking for a face…';
    }
    confirmBtn.addEventListener('click', () => {
      step = 2;
      step1.hidden = true;
      step2.hidden = false;
      shapeSize.hidden = false;
      setStatus();
    });
    document.getElementById('remark').addEventListener('click', () => {
      step = 1;
      shape = null;
      shapeBtns.forEach(b => b.setAttribute('aria-pressed', 'false'));
      step2.hidden = true;
      shapeSize.hidden = true;
      step1.hidden = false;
      setStatus();
    });
    shapeBtns.forEach(b => b.addEventListener('click', () => {
      shape = b.dataset.shape;
      shapeBtns.forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      setStatus();
    }));

    // ---------- tracking ----------
    function onLandmarks(lm) {
      faceSeen = !!lm;
      confirmBtn.disabled = !faceSeen;
      if (!lm) return;
      const px = i => ({ x: lm[i].x * W, y: lm[i].y * H });
      const mouth = { x: (lm[LIP_TOP].x + lm[LIP_BOTTOM].x) / 2 * W, y: (lm[LIP_TOP].y + lm[LIP_BOTTOM].y) / 2 * H };
      const nextPts = [px(EYE_A), px(EYE_B), mouth];
      const nextOval = OVAL.map(px);
      const ease = (a, b) => a ? b.map((p, i) => ({ x: a[i].x + (p.x - a[i].x) * SMOOTH, y: a[i].y + (p.y - a[i].y) * SMOOTH })) : b;
      pts = ease(pts, nextPts);
      oval = ease(oval, nextOval);
    }

    let landmarker = null;
    let lastTime = -1;
    function loop(now) {
      requestAnimationFrame(loop);
      if (video.readyState < 2) return;
      if (landmarker && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        const wasSeen = faceSeen;
        onLandmarks(landmarker.detectForVideo(video, now).faceLandmarks[0]);
        if (wasSeen !== faceSeen) setStatus();
      }
      updateWarp(now);
      render();
      placeMarkers();
    }

    async function loadTracker() {
      status.textContent = 'Loading face tracking…';
      const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');
      const opts = delegate => ({
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate,
        },
        runningMode: 'VIDEO',
        numFaces: 1,
      });
      try {
        landmarker = await FaceLandmarker.createFromOptions(files, opts('GPU'));
      } catch {
        landmarker = await FaceLandmarker.createFromOptions(files, opts('CPU'));
      }
      setStatus();
    }

    try {
      video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      await video.play();
      W = video.videoWidth;
      H = video.videoHeight;
      canvas.width = W;
      canvas.height = H;
      layout();
      requestAnimationFrame(loop);
      await loadTracker();
    } catch (err) {
      status.textContent = (landmarker || W ? 'Face tracking unavailable: ' : 'Camera unavailable: ') + err.message;
      step1.hidden = true;
    }
  </script>
</body>
</html>
