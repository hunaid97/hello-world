<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HN_CAM</title>
  <style>
    * { border-radius: 0; box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      /* Lettera is used from the local install; it isn't hosted here. */
      font-family: "Lettera Mono LL", "Lettera Mono", "Lettera", ui-monospace, monospace;
      font-weight: 400;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { font-weight: 400; margin: 0; letter-spacing: 0.05em; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    button {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      font: inherit;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #fff; color: #000; }
    button:disabled { opacity: 0.4; cursor: default; }
    .frame {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      border: 1px solid #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .frame img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .frame.live img { display: block; }
    .frame.live #placeholder { display: none; }
    #placeholder { padding: 16px; text-align: center; max-width: 40ch; line-height: 1.5; }
    #status, #saved { font-variant-numeric: tabular-nums; min-height: 1.2em; text-align: center; }
  </style>
</head>
<body>
  <h1>HN_CAM</h1>

  <div class="controls">
    <button id="ble">Connect Bluetooth</button>
    <button id="usb">Connect USB</button>
    <button id="folder">Choose save folder</button>
  </div>

  <div class="frame" id="frame">
    <img id="view" alt="Camera stream">
    <div id="placeholder">Connect to HN_CAM. Press the button on the camera to take a photo; it's saved in the save folder.</div>
  </div>

  <div id="status"></div>
  <div id="saved"></div>

  <script>
    const bleBtn = document.getElementById('ble');
    const usbBtn = document.getElementById('usb');
    const folderBtn = document.getElementById('folder');
    const frameEl = document.getElementById('frame');
    const view = document.getElementById('view');
    const statusEl = document.getElementById('status');
    const savedEl = document.getElementById('saved');

    // Must match the firmware.
    const BLE_NAME = 'HN_CAM';
    const SERVICE_UUID = '7a1e0001-3c4b-4d8e-9f60-4e8c1a2b3c4d';
    const DATA_UUID = '7a1e0002-3c4b-4d8e-9f60-4e8c1a2b3c4d';
    const MAX_FRAME = 2 * 1024 * 1024;

    // The active link: { kind: 'usb'|'ble', close() }
    let link = null;
    let lastUrl = null;
    let frames = 0;
    let bytes = 0;
    let statsTimer = null;

    if (!('serial' in navigator)) usbBtn.disabled = true;
    if (!('bluetooth' in navigator)) bleBtn.disabled = true;
    if (!('serial' in navigator) || !('bluetooth' in navigator)) {
      statusEl.textContent = 'Open this page in desktop Chrome for Bluetooth and USB.';
    }

    // ---- Packet parser, shared by USB and BLE ----

    let buf = new Uint8Array(256 * 1024);
    let len = 0;

    function append(chunk) {
      if (len + chunk.length > buf.length) {
        const bigger = new Uint8Array(Math.max(buf.length * 2, len + chunk.length));
        bigger.set(buf.subarray(0, len));
        buf = bigger;
      }
      buf.set(chunk, len);
      len += chunk.length;
    }

    function consume(n) {
      buf.copyWithin(0, n, len);
      len -= n;
    }

    // "XCAM" (stream frame) or "XSNP" (button photo).
    function isMagic(i) {
      return buf[i] === 0x58 &&
        ((buf[i + 1] === 0x43 && buf[i + 2] === 0x41 && buf[i + 3] === 0x4d) ||
         (buf[i + 1] === 0x53 && buf[i + 2] === 0x4e && buf[i + 3] === 0x50));
    }

    function findMagic() {
      for (let i = 0; i + 3 < len; i++) if (isMagic(i)) return i;
      return -1;
    }

    function parsePackets() {
      while (true) {
        const at = findMagic();
        if (at < 0) {
          // Keep the last 3 bytes in case a header is split across chunks.
          if (len > 3) consume(len - 3);
          return;
        }
        if (at > 0) consume(at); // skip boot logs or noise
        if (len < 8) return;
        const photo = buf[1] === 0x53;
        const size = (buf[4] | (buf[5] << 8) | (buf[6] << 16) | (buf[7] << 24)) >>> 0;
        if (size === 0 || size > MAX_FRAME) { consume(4); continue; }
        if (len < 8 + size) {
          if (photo) statusEl.textContent = `Receiving photo… ${Math.floor(100 * (len - 8) / size)}%`;
          return;
        }
        const jpeg = buf.slice(8, 8 + size);
        consume(8 + size);
        if (jpeg[0] !== 0xff || jpeg[1] !== 0xd8) continue;
        if (photo) savePhoto(new Blob([jpeg], { type: 'image/jpeg' }));
        else show(jpeg);
      }
    }

    function show(jpeg) {
      const url = URL.createObjectURL(new Blob([jpeg], { type: 'image/jpeg' }));
      view.src = url;
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = url;
      frames++;
      bytes += jpeg.length;
      frameEl.classList.add('live');
    }

    // ---- Save folder (File System Access API, remembered in IndexedDB) ----

    let folder = null;

    function idb(mode, fn) {
      return new Promise((resolve, reject) => {
        const open = indexedDB.open('hn-cam', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('kv');
        open.onerror = () => reject(open.error);
        open.onsuccess = () => {
          const tx = open.result.transaction('kv', mode);
          const req = fn(tx.objectStore('kv'));
          tx.oncomplete = () => resolve(req.result);
          tx.onerror = () => reject(tx.error);
        };
      });
    }

    async function showFolder() {
      let granted = false;
      try { granted = folder && await folder.queryPermission({ mode: 'readwrite' }) === 'granted'; } catch {}
      folderBtn.textContent = !folder ? 'Choose save folder'
        : granted ? `Save folder: ${folder.name}` : `Allow saving to ${folder.name}`;
    }

    async function loadFolder() {
      try { folder = (await idb('readonly', s => s.get('folder'))) || null; } catch { folder = null; }
      await showFolder();
    }

    // After a reload Chrome forgets write access, so the first click re-asks for it.
    // Once granted, clicking picks a different folder.
    folderBtn.addEventListener('click', async () => {
      try {
        const opts = { mode: 'readwrite' };
        if (folder && await folder.queryPermission(opts) !== 'granted') {
          await folder.requestPermission(opts);
        } else {
          folder = await window.showDirectoryPicker({ id: 'hn-cam', ...opts });
          await idb('readwrite', s => s.put(folder, 'folder'));
        }
        await showFolder();
      } catch (err) {
        if (err.name !== 'AbortError') statusEl.textContent = err.message;
      }
    });

    function photoName() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `HN_CAM_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_` +
        `${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${String(d.getMilliseconds()).padStart(3, '0')}.jpg`;
    }

    async function savePhoto(blob) {
      const name = photoName();
      try {
        if (folder && await folder.queryPermission({ mode: 'readwrite' }) === 'granted') {
          const file = await folder.getFileHandle(name, { create: true });
          const w = await file.createWritable();
          await w.write(blob);
          await w.close();
          savedEl.textContent = `Saved ${folder.name}/${name}`;
          return;
        }
      } catch (err) {
        statusEl.textContent = 'Could not write to the save folder: ' + err.message;
      }
      // No folder (or no permission): fall back to a normal download.
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      savedEl.textContent = `Downloaded ${name}. Choose a save folder to save there instead.`;
    }

    // ---- Links ----

    function setControls() {
      bleBtn.textContent = link?.kind === 'ble' ? 'Disconnect' : 'Connect Bluetooth';
      usbBtn.textContent = link?.kind === 'usb' ? 'Disconnect' : 'Connect USB';
      bleBtn.disabled = !('bluetooth' in navigator) || (link && link.kind !== 'ble');
      usbBtn.disabled = !('serial' in navigator) || (link && link.kind !== 'usb');
    }

    function startStats() {
      frames = 0;
      bytes = 0;
      statsTimer = setInterval(() => {
        statusEl.textContent = `${link.kind === 'ble' ? 'Bluetooth' : 'USB'} · ${frames} fps · ${(bytes / 1024).toFixed(0)} KB/s`;
        frames = 0;
        bytes = 0;
      }, 1000);
    }

    async function connectBle() {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ name: BLE_NAME }],
        optionalServices: [SERVICE_UUID],
      });
      statusEl.textContent = `Connecting to ${BLE_NAME}…`;
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const data = await service.getCharacteristic(DATA_UUID);

      const onData = e => {
        const v = e.target.value;
        append(new Uint8Array(v.buffer, v.byteOffset, v.byteLength));
        parsePackets();
      };
      const onGone = () => {
        if (link?.device === device) {
          statusEl.textContent = `${BLE_NAME} disconnected.`;
          disconnect(false);
        }
      };

      link = {
        kind: 'ble',
        device,
        async close() {
          data.removeEventListener('characteristicvaluechanged', onData);
          device.removeEventListener('gattserverdisconnected', onGone);
          try { await data.stopNotifications(); } catch {}
          try { device.gatt.disconnect(); } catch {}
        },
      };
      device.addEventListener('gattserverdisconnected', onGone);
      data.addEventListener('characteristicvaluechanged', onData);
      await data.startNotifications();
    }

    async function connectUsb() {
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 921600, bufferSize: 1024 * 1024 });
      // RTS high with DTR low resets the chip, so keep RTS low.
      await port.setSignals({ dataTerminalReady: true, requestToSend: false });
      const writer = port.writable.getWriter();
      let reader = null;
      // The board streams only while it keeps hearing from us.
      const keepalive = setInterval(() => writer.write(new Uint8Array([0x4b, 0])).catch(() => {}), 500);
      writer.write(new Uint8Array([0x4b, 0])).catch(() => {});

      link = {
        kind: 'usb',
        port,
        async close() {
          clearInterval(keepalive);
          try { if (reader) await reader.cancel(); } catch {}
          try { writer.releaseLock(); } catch {}
          try { await port.close(); } catch {}
        },
      };

      (async () => {
        try {
          while (link?.port === port && port.readable) {
            reader = port.readable.getReader();
            try {
              while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                if (value) { append(value); parsePackets(); }
              }
            } finally {
              reader.releaseLock();
              reader = null;
            }
          }
        } catch (err) {
          if (link?.port === port) {
            statusEl.textContent = 'Connection lost: ' + err.message;
            await disconnect(false);
          }
        }
      })();
    }

    async function disconnect(clearStatus = true) {
      clearInterval(statsTimer);
      const l = link;
      link = null;
      if (l) await l.close();
      len = 0;
      setControls();
      frameEl.classList.remove('live');
      if (clearStatus) statusEl.textContent = '';
    }

    async function toggle(connectFn) {
      try {
        if (link) { await disconnect(); return; }
        len = 0;
        await connectFn();
        setControls();
        startStats();
      } catch (err) {
        if (err.name !== 'NotFoundError') statusEl.textContent = err.message;
        await disconnect(false);
      }
    }

    bleBtn.addEventListener('click', () => toggle(connectBle));
    usbBtn.addEventListener('click', () => toggle(connectUsb));

    navigator.serial?.addEventListener('disconnect', e => {
      if (link?.port === e.target) {
        statusEl.textContent = 'Board unplugged.';
        disconnect(false);
      }
    });

    loadFolder();
  </script>
</body>
</html>
