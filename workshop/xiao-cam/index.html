<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIAO Cam</title>
  <style>
    * { border-radius: 0; box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { font-weight: 500; margin: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
    button, select, input {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      font: inherit;
      padding: 8px 14px;
    }
    button { cursor: pointer; }
    button:hover:not(:disabled) { background: #fff; color: #000; }
    button:disabled, select:disabled, input:disabled { opacity: 0.4; cursor: default; }
    label { display: flex; gap: 8px; align-items: center; }
    input[type=range] { padding: 0; accent-color: #fff; }
    .frame {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      border: 1px solid #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .frame img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .frame.live img { display: block; }
    .frame.live #placeholder { display: none; }
    #placeholder { padding: 16px; text-align: center; max-width: 36ch; line-height: 1.5; }
    #status { font-variant-numeric: tabular-nums; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>XIAO Cam</h1>

  <div class="controls">
    <button id="connect">Connect</button>
    <label>Size
      <select id="size" disabled>
        <option value="0">160×120</option>
        <option value="1">320×240</option>
        <option value="2">480×320</option>
        <option value="3" selected>640×480</option>
        <option value="4">800×600</option>
        <option value="5">1024×768</option>
        <option value="6">1280×720</option>
        <option value="7">1600×1200</option>
      </select>
    </label>
    <label>Quality
      <input id="quality" type="range" min="4" max="63" value="12" disabled>
    </label>
    <button id="snap" disabled>Snapshot</button>
  </div>

  <div class="frame" id="frame">
    <img id="view" alt="Camera stream">
    <div id="placeholder">Flash <code>xiao_cam_serial.ino</code> to the board, plug it in over USB, then press Connect and pick the board's port.</div>
  </div>

  <div id="status"></div>

  <script>
    const connectBtn = document.getElementById('connect');
    const sizeSel = document.getElementById('size');
    const qualityIn = document.getElementById('quality');
    const snapBtn = document.getElementById('snap');
    const frameEl = document.getElementById('frame');
    const view = document.getElementById('view');
    const statusEl = document.getElementById('status');

    const MAGIC = [0x58, 0x43, 0x41, 0x4d]; // "XCAM"
    const MAX_FRAME = 1024 * 1024;

    let port = null;
    let reader = null;
    let writer = null;
    let lastUrl = null;
    let lastBlob = null;
    let frames = 0;
    let bytes = 0;
    let statsTimer = null;

    if (!('serial' in navigator)) {
      statusEl.textContent = 'This browser has no Web Serial. Use Chrome or Edge on desktop.';
      connectBtn.disabled = true;
    }

    // Growable receive buffer.
    let buf = new Uint8Array(256 * 1024);
    let len = 0;

    function append(chunk) {
      if (len + chunk.length > buf.length) {
        const bigger = new Uint8Array(Math.max(buf.length * 2, len + chunk.length));
        bigger.set(buf.subarray(0, len));
        buf = bigger;
      }
      buf.set(chunk, len);
      len += chunk.length;
    }

    function consume(n) {
      buf.copyWithin(0, n, len);
      len -= n;
    }

    function findMagic() {
      for (let i = 0; i + 3 < len; i++) {
        if (buf[i] === MAGIC[0] && buf[i + 1] === MAGIC[1] && buf[i + 2] === MAGIC[2] && buf[i + 3] === MAGIC[3]) return i;
      }
      return -1;
    }

    function parseFrames() {
      while (true) {
        const at = findMagic();
        if (at < 0) {
          // Keep the last 3 bytes in case a header is split across chunks.
          if (len > 3) consume(len - 3);
          return;
        }
        if (at > 0) consume(at); // skip boot logs or noise
        if (len < 8) return;
        const size = buf[4] | (buf[5] << 8) | (buf[6] << 16) | (buf[7] << 24);
        if (size <= 0 || size > MAX_FRAME) { consume(4); continue; }
        if (len < 8 + size) return;
        const jpeg = buf.slice(8, 8 + size);
        consume(8 + size);
        if (jpeg[0] === 0xff && jpeg[1] === 0xd8) show(jpeg);
      }
    }

    function show(jpeg) {
      const blob = new Blob([jpeg], { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);
      view.src = url;
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = url;
      lastBlob = blob;
      frames++;
      bytes += jpeg.length;
      frameEl.classList.add('live');
    }

    async function send(cmd, arg) {
      if (!writer) return;
      await writer.write(new Uint8Array([cmd.charCodeAt(0), arg]));
    }

    function setControls(on) {
      sizeSel.disabled = !on;
      qualityIn.disabled = !on;
      snapBtn.disabled = !on;
      connectBtn.textContent = on ? 'Disconnect' : 'Connect';
    }

    async function connect() {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 921600, bufferSize: 1024 * 1024 });
      // Raising DTR is what tells the board a host is listening.
      await port.setSignals({ dataTerminalReady: true, requestToSend: false });
      writer = port.writable.getWriter();
      setControls(true);

      await send('S', Number(sizeSel.value));
      await send('Q', Number(qualityIn.value));

      statsTimer = setInterval(() => {
        statusEl.textContent = `${frames} fps · ${(bytes / 1024).toFixed(0)} KB/s` +
          (view.naturalWidth ? ` · ${view.naturalWidth}×${view.naturalHeight}` : '');
        frames = 0;
        bytes = 0;
      }, 1000);

      readLoop();
    }

    async function readLoop() {
      try {
        while (port && port.readable) {
          reader = port.readable.getReader();
          try {
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              if (value) { append(value); parseFrames(); }
            }
          } finally {
            reader.releaseLock();
            reader = null;
          }
        }
      } catch (err) {
        statusEl.textContent = 'Connection lost: ' + err.message;
        await disconnect(false);
      }
    }

    async function disconnect(clearStatus = true) {
      clearInterval(statsTimer);
      const p = port;
      port = null;
      try { if (reader) await reader.cancel(); } catch {}
      try { if (writer) { writer.releaseLock(); writer = null; } } catch {}
      try { if (p) await p.close(); } catch {}
      len = 0;
      setControls(false);
      frameEl.classList.remove('live');
      if (clearStatus) statusEl.textContent = '';
    }

    connectBtn.addEventListener('click', async () => {
      try {
        if (port) await disconnect();
        else await connect();
      } catch (err) {
        if (err.name !== 'NotFoundError') statusEl.textContent = err.message;
        await disconnect(false);
      }
    });

    sizeSel.addEventListener('change', () => send('S', Number(sizeSel.value)));
    qualityIn.addEventListener('change', () => send('Q', Number(qualityIn.value)));

    snapBtn.addEventListener('click', () => {
      if (!lastBlob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(lastBlob);
      a.download = `xiao-${new Date().toISOString().replace(/[:.]/g, '-')}.jpg`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    navigator.serial?.addEventListener('disconnect', (e) => {
      if (e.target === port) {
        statusEl.textContent = 'Board unplugged.';
        disconnect(false);
      }
    });
  </script>
</body>
</html>
